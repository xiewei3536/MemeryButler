name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Logic and safety regression checks
        run: MEMORYBUTLER_SELFTEST=checks .build/debug/MemoryButler
      - name: Read-only runtime and small-screen layout smoke test
        env:
          MEMORYBUTLER_SELFTEST: '1'
          MEMORYBUTLER_SNAPSHOT_DIR: /tmp/memorybutler-snapshots
          MEMORYBUTLER_SNAPSHOT_SCREEN_HEIGHT: '695'
        run: .build/debug/MemoryButler
      - name: Upload UI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: memorybutler-ui-${{ matrix.os }}
          path: /tmp/memorybutler-snapshots
