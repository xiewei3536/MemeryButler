name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Logic and safety regression checks
        run: MEMORYBUTLER_SELFTEST=checks .build/debug/MemoryButler
      - name: Read-only runtime diagnostics and supported-GPU layout smoke test
        env:
          MEMORYBUTLER_SELFTEST: '1'
          # Intel hosted VM 的 Metal 離屏渲染會中止；兩架構都跑診斷，快照交給 Apple Silicon。
          MEMORYBUTLER_SNAPSHOT_DIR: ${{ matrix.os == 'macos-15' && '/tmp/memorybutler-snapshots' || '' }}
          MEMORYBUTLER_SNAPSHOT_SCREEN_HEIGHT: '695'
        run: .build/debug/MemoryButler
      - name: Upload UI snapshots
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: memorybutler-ui-${{ matrix.os }}
          path: /tmp/memorybutler-snapshots
